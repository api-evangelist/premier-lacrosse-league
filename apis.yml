aid: premier-lacrosse-league
name: Premier Lacrosse League
description: 'The Premier Lacrosse League (PLL) is the professional field lacrosse league of
  North America, founded in 2018 by brothers Paul and Mike Rabil and headquartered in El Segundo,
  California. It played its inaugural season in 2019 as a tour-based league, absorbed Major League
  Lacrosse in December 2020, and now fields eight city-affiliated clubs across an Eastern and a
  Western conference. Games are carried by ESPN, ESPN2, ABC and ESPN+, and investors include The
  Chernin Group, The Raine Group, Arctos Partners and ESPN itself. Digitally the league runs a
  Next.js web property with an Apollo GraphQL API behind it (premierlacrosseleague.com/api/graphql),
  a dedicated stats site, iOS and Android apps, and a Shopify-hosted merchandise store that
  publishes an llms.txt, a Universal Commerce Protocol (UCP) profile and an MCP endpoint for
  agent-driven commerce. The league publishes no developer portal, no OpenAPI and no public API
  documentation; every machine-readable surface below was discovered by probing.'
