- name: Premier Lacrosse League Shop Storefront and Agent Commerce API
  description: 'The league''s Shopify-hosted merchandise store exposes a public, unauthenticated
    product/collection JSON surface, a Universal Commerce Protocol (UCP) merchant profile at
    /.well-known/ucp, an MCP endpoint at /api/ucp/mcp for agent-driven shopping and checkout, an
    OAuth 2.0 / OpenID Connect customer-account authorization server, and an agent-facing llms.txt
    describing all of it. All of these are served from the league''s own shop host.'
  humanURL: https://shop.premierlacrosseleague.com/
  baseURL: https://shop.premierlacrosseleague.com
