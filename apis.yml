apis:
- name: Premier Lacrosse League Web GraphQL API
  description: 'Apollo Server GraphQL API that backs premierlacrosseleague.com and
    stats.premierlacrosseleague.com (teams, players, games, standings, stats). Undocumented and
    unadvertised: there is no developer portal, no schema download and no API key programme.
    Introspection is disabled in production and the endpoint is CORS origin-restricted to the
    league''s own web properties. Confirmed live by probe on 2026-08-02.'
  humanURL: https://stats.premierlacrosseleague.com/
  baseURL: https://premierlacrosseleague.com/api/graphql
